<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#fff}body{display:flex;justify-content:center}iframe{display:block;border:0;flex:0 0 auto}</style></head>
<body>
<script>
  // Host page for headless captures: Chrome's minimum window width is 500px, so narrow
  // breakpoints are rendered inside an iframe of the exact width and cropped afterwards.
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '390', 10), src = q.get('src');
  var f = document.createElement('iframe'); f.width = w; f.style.width = w + 'px'; f.style.height = '900px'; f.src = src;
  document.body.appendChild(f);
  function fit() {
    try {
      var d = f.contentDocument.documentElement;
      var h = Math.max(d.scrollHeight, f.contentDocument.body.scrollHeight);
      f.style.height = h + 'px';
      document.documentElement.setAttribute('data-h', h);
      document.documentElement.setAttribute('data-w', f.contentWindow.innerWidth + 'x' + d.scrollWidth);
    } catch (e) {}
  }
  f.addEventListener('load', function(){ fit(); setTimeout(fit, 400); setTimeout(fit, 1500); });
</script>
</body></html>
